name: Fastlap quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fastlap_ci
          POSTGRES_PASSWORD: ci-only-not-a-production-password
          POSTGRES_DB: fastlap_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fastlap_ci -d fastlap_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://fastlap_ci:ci-only-not-a-production-password@127.0.0.1:5432/fastlap_ci
      SECRET_KEY: ci-only-key-for-isolated-tests-never-use-in-production-63
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
      USE_S3: "False"
      SENTRY_DSN: ""
      APP_ENVIRONMENT: ci
      APP_RELEASE: ${{ github.sha }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install dependencies and database tools
        run: |
          python -m pip install -r requirements-ci.txt
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-16
      - name: Check configuration, migrations and JavaScript syntax
        run: |
          python manage.py check
          python manage.py security_audit --strict
          python manage.py makemigrations --check --dry-run
          find league/static/league -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Check known dependency vulnerabilities
        run: python -m pip_audit -r requirements.txt
      - name: Game logic regression tests
        run: |
          node tests/arcade_library_deadline.mjs
          node tests/doodle_endless.mjs
          node tests/tetris_engine.mjs
          node tests/tetris_gestures.mjs
          node tests/tetris_scenery.mjs
          node tests/tetris_audio.mjs
          node tests/tetris_feedback.mjs
      - name: Test fresh migrations and restore on isolated PostgreSQL
        run: |
          python manage.py migrate --noinput
          python scripts/ci_restore_drill.py
      - name: Backend and PostgreSQL concurrency tests
        run: python manage.py test --noinput
      - name: Build production static assets
        run: python manage.py collectstatic --noinput
      - name: Install test browsers
        run: python -m playwright install --with-deps chromium webkit
      - name: Desktop and mobile browser smoke tests
        run: |
          python tests/arcade_security_browser.py --browser chromium
          python tests/arcade_security_browser.py --browser webkit
          python tests/monitoring_browser.py --browser chromium
          python tests/monitoring_browser.py --browser webkit
          python tests/nightshift_browser.py --browser webkit --widths 390 1440 --output-dir /tmp/fastlap-ci-ui
          python tests/calendar_browser.py --browser webkit --output-dir /tmp/fastlap-ci-calendar

# A green workflow does NOT automatically gate an independent Timeweb auto-deploy.
# Configure branch protection/deployment separately; see docs/reliability.md.
