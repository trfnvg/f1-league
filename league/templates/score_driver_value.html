{% if drivers %}<div class="sr-drivers">{% for driver in drivers %}<div class="sr-driver" style="--driver-accent:{{ driver.team_color }}"><span class="sr-driver-photo" aria-hidden="true"><span>{{ driver.surname|slice:':1' }}</span>{% if driver.photo %}<img src="{{ driver.photo }}" alt="" width="56" height="56" loading="lazy" decoding="async" data-driver-photo referrerpolicy="no-referrer">{% endif %}</span><span class="sr-driver-copy"><strong>{{ driver.surname }}</strong><small>{% if driver.number != None %}<b>{{ driver.number }}</b>{% endif %} {{ driver.team }}</small></span></div>{% endfor %}</div>{% else %}<strong class="sr-value{% if value == '—' %} is-empty{% endif %}">{{ value }}</strong>{% endif %}
