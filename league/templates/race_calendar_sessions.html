{% load tz %}
{% timezone 'Europe/Moscow' %}
<dl class="rc-sessions{% if feature %} rc-sessions-feature{% endif %}">
  {% for session in race.session_rows %}
  <div class="{% if session.is_race %}rc-session-race{% endif %}" data-calendar-session="{{ session.code }}"><dt><span class="rc-session-marker{% if session.is_race %} rc-race-marker{% endif %}">{{ session.code }}</span><span>{{ session.label }}</span></dt><dd>{% if session.at %}<time datetime="{{ session.at|date:'c' }}" data-calendar-time data-venue="{{ race.venue_timezone }}">{{ session.at|date:'d.m · H:i' }}</time>{% else %}<span class="rc-tbc">Время уточняется</span>{% endif %}</dd></div>
  {% endfor %}
</dl>
{% endtimezone %}
