{% load static %}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#17131e">
  <title>Огни погасли · Fastlap</title>
  <link rel="stylesheet" href="{% static 'league/lights-out.css' %}?v=5-grid">
</head>
<body>
  <main class="lights-out" data-lights-out data-player-id="{{ user.pk }}"
    data-sound-url="{% static 'league/audio/lights-out-lamp.wav' %}" data-state="ready">
    <div class="lights-out-scene" aria-hidden="true" data-server-ms="{{ server_ms|stringformat:'s' }}" data-deadline-ms="{{ deadline_ms|stringformat:'s' }}">
      <div class="grid-matte">
        <picture>
          <source media="(max-aspect-ratio: 1/1)" sizes="max(100vw, 56.3vh)" srcset="{% static 'league/images/lights-out/grid-portrait.webp' %} 941w, {% static 'league/images/lights-out/grid-portrait-hd.webp' %} 1440w">
          <img src="{% static 'league/images/lights-out/grid-wide.webp' %}" sizes="max(100vw, 177.8vh)" srcset="{% static 'league/images/lights-out/grid-wide.webp' %} 1672w, {% static 'league/images/lights-out/grid-wide-hd.webp' %} 3840w" alt="" width="1672" height="941" fetchpriority="high">
        </picture>
        <div class="grid-people"></div>
        <div class="grid-night"></div>
        <div class="grid-practicals"></div>
        <div class="grid-atmosphere">
          <div class="grid-sun"></div>
          <div class="lights-out-sky">
            <img class="lights-out-cloud lights-out-cloud--far" src="{% static 'league/images/lights-out/yas-marina-clouds.webp' %}" alt="" decoding="async">
            <img class="lights-out-cloud lights-out-cloud--near" src="{% static 'league/images/lights-out/yas-marina-clouds.webp' %}" alt="" decoding="async">
          </div>
        </div>
      </div>
      <svg width="0" height="0" class="grid-filter"><defs><filter id="grid-grade" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB">
        <feColorMatrix type="saturate" values="1"/>
        <feComponentTransfer><feFuncR type="identity"/><feFuncG type="identity"/><feFuncB type="identity"/></feComponentTransfer>
      </filter>
      <filter id="grid-emission" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB">
        <feComponentTransfer>
          <feFuncR type="table" tableValues="0 0 0 0 0 0 .02 .38 .95"/>
          <feFuncG type="table" tableValues="0 0 0 0 0 0 .04 .53 1"/>
          <feFuncB type="table" tableValues="0 0 0 0 0 0 .10 .76 1"/>
        </feComponentTransfer>
      </filter></defs></svg>
    </div>
    <header class="lights-out-header">
      <div class="lights-out-heading">
        <a class="lights-out-back" href="{% url 'league:arcade_control' %}">← К тестированию</a>
        <p>Абу-Даби · Финал сезона</p>
        <h1>Огни погасли</h1>
      </div>
      <div class="lights-out-tools">
        <button type="button" class="lights-out-audio" data-audio aria-label="Звук" aria-pressed="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9h4l5-4v14l-5-4H3z"/><path class="lights-out-waves" d="M16 9a4 4 0 0 1 0 6m2-9a8 8 0 0 1 0 12"/><path class="lights-out-muted" d="m16 9 6 6m0-6-6 6"/></svg>
        </button>
        <div class="lights-out-best"><span>Рекорд</span><strong data-best>—</strong></div>
      </div>
    </header>
    <section class="lights-out-signal" aria-label="Стартовый светофор">
      <div class="lights-out-gantry" aria-hidden="true">
        <span data-lamp></span><span data-lamp></span><span data-lamp></span><span data-lamp></span><span data-lamp></span>
      </div>
      <p class="lights-out-status" role="status" aria-atomic="true" data-status>Готов к последнему старту?</p>
    </section>
    <footer class="lights-out-controls">
      <p class="lights-out-result" data-result hidden>
        <span class="lights-out-result-label">Реакция</span>
        <span><strong data-time></strong> мс</span>
      </p>
      <button type="button" class="lights-out-action" data-action>Старт</button>
      <p class="lights-out-hint"><span data-hint>Нажми, когда погаснут все пять огней</span><kbd>Пробел</kbd></p>
    </footer>
    <noscript><p class="lights-out-noscript">Включи JavaScript, чтобы сыграть.</p></noscript>
  </main>
  <script src="{% static 'league/lights-out.js' %}?v=4-lamp-cadence" defer></script>
  <script src="{% static 'league/lights-out-scene.js' %}?v=1" defer></script>
</body>
</html>
