<div class="player-answer-grid">
  {% for answer in row.answers %}
    <div class="player-answer">
      <div class="player-answer-label">{{ answer.label }}</div>
      <div class="player-answer-reward">{{ answer.points }} баллов за верный прогноз</div>
      <div class="player-answer-value">{{ answer.value }}</div>
      {% if answer.fact != None %}<div class="player-answer-fact">Факт: {{ answer.fact }}</div>{% endif %}
    </div>
  {% endfor %}
</div>
