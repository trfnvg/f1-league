{% load circuit_extras %}<svg class="circuit-visual{% if animated %} is-animated{% endif %}" viewBox="0 0 620 370" role="img" aria-label="Схема трассы {{ circuit.name }}" data-circuit="{{ circuit.key }}" xmlns="http://www.w3.org/2000/svg">
  <title>{{ circuit.name }}</title>
  <path class="circuit-road" d="{{ circuit.path }}"/>
  <path class="circuit-edge" d="{{ circuit.path }}"/>
  <path class="circuit-trace" id="circuit-path-{{ track_id }}" d="{{ circuit.path }}" pathLength="1000"/>
  <circle class="circuit-start-ring" cx="{{ circuit.start_x|default:0 }}" cy="{{ circuit.start_y|default:0 }}" r="8"/>
  <circle class="circuit-start" cx="{{ circuit.start_x|default:0 }}" cy="{{ circuit.start_y|default:0 }}" r="3"/>
  <g class="circuit-labels" aria-label="Старт и схематичные обозначения секторов">
    <text class="circuit-label circuit-start-label" x="{{ circuit.start_label.x }}" y="{{ circuit.start_label.y }}">START</text>
    {% for label in circuit.sector_labels %}<text class="circuit-label circuit-sector-label" x="{{ label.x }}" y="{{ label.y }}">{{ label.text }}</text>{% endfor %}
  </g>
  {% if animated %}{% circuit_drivers as racers %}<g class="circuit-peloton"><desc>Декоративная гонка со случайным порядком, не реальные позиции пилотов.</desc>{% for racer in racers %}<circle class="circuit-car" r="4" fill="{{ racer.color }}" data-racer="{{ racer.key }}" data-team="{{ racer.team }}"><title>{{ racer.name }} · №{{ racer.number }} · {{ racer.team }}</title></circle>{% endfor %}</g>{% endif %}
</svg>
