<svg class="circuit-visual{% if animated %} is-animated{% endif %}" viewBox="0 0 620 370" role="img" aria-label="Схема трассы {{ circuit.name }}" data-circuit="{{ circuit.key }}" xmlns="http://www.w3.org/2000/svg">
  <title>{{ circuit.name }}</title>
  <path class="circuit-road" d="{{ circuit.path }}"/>
  <path class="circuit-edge" d="{{ circuit.path }}"/>
  <path class="circuit-trace" id="circuit-path-{{ track_id }}" d="{{ circuit.path }}" pathLength="1000"/>
  <circle class="circuit-start-ring" cx="{{ circuit.start_x|default:0 }}" cy="{{ circuit.start_y|default:0 }}" r="8"/>
  <circle class="circuit-start" cx="{{ circuit.start_x|default:0 }}" cy="{{ circuit.start_y|default:0 }}" r="3"/>
  {% if animated %}<circle class="circuit-runner-halo" r="9"><animateMotion dur="14s" repeatCount="indefinite"><mpath href="#circuit-path-{{ track_id }}"/></animateMotion></circle><circle class="circuit-runner" r="4.5"><animateMotion dur="14s" repeatCount="indefinite"><mpath href="#circuit-path-{{ track_id }}"/></animateMotion></circle>{% endif %}
</svg>
